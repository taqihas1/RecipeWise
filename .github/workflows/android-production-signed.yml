name: Android Production Build - Signed AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'aab'
        type: choice
        options:
          - aab
          - apk

jobs:
  build-android-signed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/recipewise-release.keystore
          chmod 600 android/app/recipewise-release.keystore

      - name: Setup signing config
        run: |
          cat > android/gradle.properties.sig << 'EOF'
          MYAPP_UPLOAD_STORE_FILE=recipewise-release.keystore
          MYAPP_UPLOAD_KEY_ALIAS=recipewise-key
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          cat android/gradle.properties.sig >> android/gradle.properties

      - name: Build signed AAB
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/recipewise-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=recipewise-key \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: recipewise-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Build signed APK (if requested)
        if: github.event.inputs.build_type == 'apk'
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/recipewise-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=recipewise-key \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact (if requested)
        if: github.event.inputs.build_type == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: recipewise-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Cleanup keystore
        if: always()
        run: rm -f android/app/recipewise-release.keystore

      - name: Build success notification
        if: success()
        run: |
          echo "✅ SIGNED BUILD COMPLETE!"
          echo ""
          echo "📦 Download the AAB from the Artifacts section above"
          echo "🔗 Upload to Google Play Console at: https://play.google.com/console"
          echo ""
          echo "⚠️  IMPORTANT: This keystore is CRITICAL for updates!"
          echo "   Keep recipewise-release.keystore safe forever!"
