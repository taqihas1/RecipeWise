name: Install Missing Expo Package

on:
  workflow_dispatch: # This adds a manual "Run" button in the GitHub UI

jobs:
  install-and-commit:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull the repository files into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Add the package to package.json
      - name: Install expo-linear-gradient
        run: |
          npm install expo-linear-gradient

      # 4. Commit and push package.json and package-lock.json back to your repository
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: add expo-linear-gradient package via GitHub Actions"
          git push origin ${{ github.ref_name }}
